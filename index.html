<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 合宿レク イベント進行ツール</title>
<style>
/* ============================================================
   合宿レク イベント進行＆得点管理ツール
   デザイン: Apple Japan (awesome-design-md-jp / apple DESIGN.md 準拠)
   - フォント: SF Pro JP 先頭 / ヒラギノ角ゴ Pro（ProNではない）
   - テキスト: #1d1d1f（純黒は不使用）/ ダーク上は #f5f5f7
   - 本文: 17px / 1.47 / letter-spacing -0.357px（負のトラッキング）
   - ボタン: 980px ピル型 / Apple Blue #0071e3
   - ナビ: すりガラス rgba(0,0,0,.8) + blur(20px)
   - 投影ステージ: ヒーロー流儀の #000（投影グレア対策を兼ねる）
   ※ クイズ「フジヌマ男爵からの挑戦状」の羊皮紙デザインのみ現行を維持
   ============================================================ */
:root{
  --bg:#f5f5f7; --panel:#fff; --panel2:#f5f5f7;
  --line:#d2d2d7; --text:#1d1d1f; --muted:#6e6e73;
  --accent:#0071e3; --link:#0066cc; --accent-dark:#2997ff;
  --good:#34c759; --bad:#ff3b30;
  --on-dark:#f5f5f7; --on-dark-muted:rgba(255,255,255,.56);
  --card-shadow:3px 5px 30px rgba(0,0,0,.22);
  --soft-shadow:0 2px 12px rgba(0,0,0,.06);
  --focus-ring:0 0 0 3px rgba(0,113,227,.2);
  --radius:18px;
  --font-text:"SF Pro JP","SF Pro Text","SF Pro Icons","Hiragino Kaku Gothic Pro","ヒラギノ角ゴ Pro W3",メイリオ,Meiryo,"ＭＳ Ｐゴシック","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-display:"SF Pro JP","SF Pro Display","SF Pro Icons","Hiragino Kaku Gothic Pro","ヒラギノ角ゴ Pro W3",メイリオ,Meiryo,"ＭＳ Ｐゴシック","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-text);
  font-size:17px;line-height:1.47;letter-spacing:-.357px;
  background:var(--bg);color:var(--text);
  overflow-x:hidden;min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;font-weight:400;letter-spacing:-.2px}
input,select{font-family:inherit}
.hidden{display:none !important}

/* ---------- App shell（すりガラスナビ） ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;padding:0 22px;min-height:48px;
  background:rgba(0,0,0,.8);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  color:rgba(255,255,255,.92);
  position:sticky;top:0;z-index:50;
}
.topbar h1{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.topbar h1 .sub{font-size:12px;color:rgba(255,255,255,.56);font-weight:400;margin-left:10px;letter-spacing:normal}
.spacer{flex:1}
.tbtn{
  background:transparent;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.92);
  padding:6px 16px;border-radius:980px;font-size:12px;
  display:inline-flex;align-items:center;gap:6px;transition:background .2s,border-color .2s;
}
.tbtn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.6)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.total-pill{font-size:12px;color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.25);
  padding:5px 14px;border-radius:980px;white-space:nowrap;letter-spacing:normal}

/* ---------- Layout ---------- */
.wrap{display:grid;grid-template-columns:1fr 460px;gap:20px;padding:20px;max-width:1680px;margin:0 auto}
@media(max-width:1150px){.wrap{grid-template-columns:1fr}}

/* ---------- Stage（投影エリア / ヒーロー黒） ---------- */
.stage{
  background:#000;color:var(--on-dark);
  border-radius:var(--radius);
  min-height:560px;padding:28px;position:relative;overflow:hidden;
}
.stage-label{position:absolute;top:16px;right:20px;font-size:11px;color:rgba(255,255,255,.4);
  letter-spacing:2px;font-weight:600}

/* ---------- Control dock（ライトカード） ---------- */
.dock{background:var(--panel);border-radius:var(--radius);
  box-shadow:var(--soft-shadow);overflow:hidden;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
.tab{flex:1;padding:14px 4px;background:transparent;color:rgba(0,0,0,.56);font-size:12px;
  border-bottom:2px solid transparent;transition:color .2s;letter-spacing:normal}
.tab.active{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.tab:hover{color:var(--text)}
.panel{padding:20px;overflow-y:auto;max-height:calc(100vh - 190px)}
.panel h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px;letter-spacing:normal}

/* ---------- Scoreboard（黒ヒーロー上） ---------- */
.board-title{font-family:var(--font-display);text-align:center;font-size:clamp(24px,3vw,40px);font-weight:600;
  line-height:1.1;letter-spacing:-.4px;margin-bottom:8px;color:var(--on-dark)}
.board-sub{text-align:center;color:var(--on-dark-muted);font-size:14px;margin-bottom:24px;letter-spacing:normal}
.rankrow{
  display:flex;align-items:center;gap:16px;padding:14px 20px;margin-bottom:12px;border-radius:16px;
  background:rgba(255,255,255,.08);
  position:relative;transition:transform .55s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s;
}
.rankrow .rank{font-family:var(--font-display);font-size:clamp(24px,2.6vw,38px);font-weight:600;width:60px;text-align:center;flex:none;color:var(--on-dark-muted)}
.rankrow .medal{font-size:clamp(26px,3vw,42px);width:60px;text-align:center;flex:none}
.rankrow .tname{font-family:var(--font-display);font-size:clamp(17px,2vw,27px);font-weight:600;letter-spacing:-.2px;flex:none;width:clamp(150px,17vw,250px);color:var(--on-dark)}
.rankrow .tmembers{font-size:12px;color:var(--on-dark-muted);margin-top:3px;font-weight:400;letter-spacing:normal}
.rankrow .barwrap{flex:1;height:22px;background:rgba(255,255,255,.12);border-radius:980px;overflow:hidden;position:relative}
.rankrow .bar{height:100%;border-radius:980px;transition:width .8s cubic-bezier(.2,.9,.3,1);min-width:2px}
.rankrow .score{font-family:var(--font-display);font-size:clamp(26px,3vw,44px);font-weight:600;width:clamp(100px,10vw,140px);text-align:right;flex:none;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.rankrow.leader{box-shadow:0 0 0 2px var(--accent-dark)}
.flash-up{animation:flashUp .9s ease}
@keyframes flashUp{0%{background:rgba(52,199,89,.35)}100%{}}
.flash-down{animation:flashDown .9s ease}
@keyframes flashDown{0%{background:rgba(255,59,48,.3)}100%{}}

/* podium (result) */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:24px;margin:12px 0 28px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .pcap{font-size:44px}
.pod .pname{font-family:var(--font-display);font-weight:600;font-size:clamp(15px,1.7vw,23px);letter-spacing:-.2px;color:var(--on-dark)}
.pod .pscore{font-family:var(--font-display);font-weight:600;font-size:clamp(19px,2.2vw,30px);color:var(--accent-dark);letter-spacing:-.3px}
.pod .pblock{width:clamp(90px,10vw,150px);border-radius:14px 14px 0 0;display:flex;align-items:flex-start;
  justify-content:center;padding-top:10px;font-family:var(--font-display);font-size:32px;font-weight:600;color:rgba(0,0,0,.5)}
.pod.p1 .pblock{height:190px}
.pod.p2 .pblock{height:140px}
.pod.p3 .pblock{height:105px}

/* ---------- Timer ---------- */
.timer-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:480px}
.timer-label{font-family:var(--font-display);font-size:clamp(17px,2.2vw,28px);color:var(--on-dark-muted);font-weight:600;margin-bottom:6px;letter-spacing:-.2px}
.timer-num{font-family:var(--font-display);font-size:clamp(120px,26vw,340px);font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;
  letter-spacing:-6px;color:var(--on-dark)}
.timer-num.warn{color:var(--accent-dark)}
.timer-num.danger{color:#ff453a;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.timer-done{font-family:var(--font-display);font-size:clamp(50px,10vw,130px);font-weight:600;letter-spacing:-2px;color:var(--accent-dark);animation:pop .4s}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- Topic (illustration) ---------- */
.topic-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:480px;text-align:center}
.topic-count{color:var(--on-dark-muted);font-size:17px;font-weight:400;margin-bottom:14px;letter-spacing:normal}
.topic-set{color:var(--accent-dark);font-size:17px;font-weight:600;margin-bottom:22px;letter-spacing:normal}
.topic-answer{font-family:var(--font-display);font-size:clamp(48px,9vw,120px);font-weight:600;line-height:1.1;letter-spacing:-1px;color:var(--on-dark)}
.topic-hidden{font-family:var(--font-display);font-size:clamp(60px,12vw,160px);font-weight:600;color:rgba(255,255,255,.35);letter-spacing:18px}

/* ---------- Gacha ---------- */
.gacha-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:480px;text-align:center}
.gacha-title{font-family:var(--font-display);font-size:clamp(24px,3vw,40px);font-weight:600;line-height:1.1;letter-spacing:-.4px;margin-bottom:26px;color:var(--on-dark)}
.reel{width:min(80%,640px);height:150px;overflow:hidden;border:1px solid rgba(255,255,255,.25);border-radius:20px;
  background:rgba(255,255,255,.06);position:relative}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:40px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(#000c,transparent)}
.reel::after{bottom:0;background:linear-gradient(transparent,#000c)}
.reel-track{display:flex;flex-direction:column;transition:none}
.reel-item{height:150px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:clamp(24px,4vw,48px);font-weight:600;letter-spacing:-.5px;flex:none;white-space:nowrap;padding:0 24px;
  overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--on-dark)}
.gacha-result{margin-top:24px;font-family:var(--font-display);font-size:clamp(28px,4.5vw,62px);font-weight:600;letter-spacing:-.5px;color:var(--accent-dark);
  min-height:76px;display:flex;align-items:center;gap:14px}
.gacha-win-team{font-size:clamp(17px,2vw,26px);color:var(--on-dark-muted);font-weight:400;margin-top:6px;letter-spacing:normal}

/* ---------- Score control cards（ライト） ---------- */
.teamctl{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--panel)}
.teamctl-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.teamctl-name{font-weight:600;font-size:15px;letter-spacing:-.2px}
.teamctl-score{margin-left:auto;font-family:var(--font-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.btnrow .lbl{font-size:12px;color:var(--muted);width:52px;display:flex;align-items:center;font-weight:400;letter-spacing:normal}
.pbtn{background:var(--panel2);padding:7px 15px;border-radius:980px;font-size:13px;color:var(--text);transition:background .2s;letter-spacing:normal}
.pbtn:hover{background:#e8e8ed}
.pbtn.good{background:rgba(52,199,89,.15);color:#1d7a35}
.pbtn.good:hover{background:rgba(52,199,89,.25)}
.pbtn.mid{background:rgba(255,149,0,.15);color:#9a5b00}
.pbtn.mid:hover{background:rgba(255,149,0,.25)}
.pbtn.sub{background:rgba(255,59,48,.12);color:#d70015}
.pbtn.sub:hover{background:rgba(255,59,48,.22)}
.custom-in{width:58px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px;border-radius:10px;text-align:center}
.custom-in:focus{outline:none;box-shadow:var(--focus-ring);border-color:var(--accent)}

/* generic form bits */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:400;letter-spacing:normal}
.field input,.field select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:10px 12px;border-radius:12px;font-size:14px}
.field input:focus,.field select:focus{outline:none;box-shadow:var(--focus-ring);border-color:var(--accent)}
.bigbtn{width:100%;padding:12px 22px;border-radius:980px;font-size:17px;font-weight:400;background:var(--accent);color:#fff;margin-top:4px;transition:background .2s;letter-spacing:-.2px}
.bigbtn:hover{background:#0077ed}
.bigbtn.spin{background:#1d1d1f;color:#fff}
.bigbtn.spin:hover{background:#333336}
.bigbtn:disabled{opacity:.4;cursor:not-allowed}
.ghostbtn{width:100%;padding:10px 22px;border-radius:980px;background:transparent;border:1px solid var(--accent);color:var(--accent);font-size:14px;margin-top:8px;transition:background .2s;letter-spacing:normal}
.ghostbtn:hover{background:rgba(0,113,227,.06)}
.dangerbtn{border-color:var(--bad);color:#d70015}
.dangerbtn:hover{background:rgba(255,59,48,.06)}

/* history / lists */
.log{font-size:12px;color:var(--muted);max-height:180px;overflow-y:auto;border-top:1px solid var(--line);margin-top:12px;padding-top:10px;letter-spacing:normal}
.logrow{padding:5px 0;border-bottom:1px solid rgba(0,0,0,.05);display:flex;gap:8px}
.logrow .lt{color:#86868b;flex:none}
.prizerow{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;background:var(--panel)}
.prizerow .pn{flex:1;font-size:14px;font-weight:600;letter-spacing:-.2px}
.prizerow .pq{font-size:12px;color:var(--muted);letter-spacing:normal}
.prizerow .rm{background:rgba(255,59,48,.12);color:#d70015;border-radius:980px;padding:5px 12px;font-size:12px;letter-spacing:normal}
.scene-btns{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.scene-btn{flex:1;min-width:70px;padding:9px 6px;border-radius:980px;background:var(--panel2);color:var(--text);font-size:13px;transition:background .2s;letter-spacing:normal}
.scene-btn:hover{background:#e8e8ed}
.scene-btn.active{background:var(--accent);color:#fff}
.tt-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:13px;letter-spacing:normal}
.tt-row .tt-time{color:var(--accent);font-weight:600;width:110px;flex:none;font-variant-numeric:tabular-nums}
.mini{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:normal}
.chip{display:inline-block;background:rgba(255,255,255,.1);border-radius:980px;padding:5px 14px;font-size:13px;margin:2px;color:var(--on-dark);letter-spacing:normal}

/* present mode fills screen */
body.present .topbar,body.present .dock{display:none}
body.present .wrap{grid-template-columns:1fr;padding:0;max-width:none}
body.present .stage{min-height:100vh;border-radius:0}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:9999}
.footer{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px;padding:6px;letter-spacing:normal}

/* ---------- ゲームマスター（主催者 / 黒ステージ上） ---------- */
.host-avatar{border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;flex:none}
.host-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.host-badge{position:absolute;left:20px;bottom:18px;display:flex;align-items:center;gap:11px;z-index:3;
  background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  padding:7px 18px 7px 7px;border-radius:980px}
.host-badge .hb-txt{font-family:var(--font-display);font-size:15px;font-weight:600;line-height:1.2;color:var(--on-dark);letter-spacing:-.2px}
.host-badge .hb-sub{font-size:10px;color:var(--on-dark-muted);font-weight:400;letter-spacing:1px}
.host-result{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px}
.host-bubble{background:rgba(255,255,255,.1);border-radius:18px;
  padding:12px 22px;font-size:clamp(14px,1.6vw,19px);font-weight:400;max-width:80%;text-align:center;color:var(--on-dark);letter-spacing:normal}
.host-name{font-family:var(--font-display);font-size:clamp(14px,1.6vw,19px);font-weight:600;color:var(--on-dark);letter-spacing:-.2px}
.host-name .hn-sub{color:var(--on-dark-muted);font-size:12px;font-weight:400;margin-left:6px;letter-spacing:normal}
@media(max-width:640px){.host-badge{left:10px;bottom:10px;padding:5px 12px 5px 5px}.host-badge .hb-txt{font-size:13px}}

/* ---------- クイズ「フジヌマ男爵からの挑戦状」宝の地図テーマ（現行維持） ---------- */
/* ハレーション対策：羊皮紙は白ではなく落ち着いた琥珀色＋暗いビネットで輝度を抑える */
.stage.quiz-scene{background:radial-gradient(120% 120% at 50% 30%,#2a1c0e 0%,#1a1108 60%,#0d0803 100%)}
.quiz-stage{min-height:520px;display:flex;align-items:center;justify-content:center;padding:8px}
.parchment{position:relative;width:min(94%,900px);border-radius:10px;padding:clamp(26px,4vw,54px);
  font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP","MS Mincho",serif;color:#3a2410;text-align:center;letter-spacing:normal;
  background:radial-gradient(115% 130% at 50% 42%,#f0e0ba 0%,#e6d2a2 46%,#cdb079 74%,#a9884e 100%);
  box-shadow:inset 0 0 90px rgba(90,55,15,.55),inset 0 0 24px rgba(60,35,10,.4),0 22px 60px rgba(0,0,0,.65);
  border:1px solid #7a5a2e}
.parchment::before{content:"";position:absolute;inset:12px;border:2px dashed rgba(120,80,35,.5);border-radius:6px;pointer-events:none}
.parchment .deco{position:absolute;opacity:.28;font-size:34px;pointer-events:none}
.parchment .deco.tl{top:14px;left:18px}.parchment .deco.br{bottom:14px;right:18px}
.q-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-text);font-weight:800;font-size:14px;
  color:#5a3a12;background:linear-gradient(180deg,#f3d98a,#d9a83f);border:1px solid #a9791f;border-radius:30px;
  padding:6px 16px;box-shadow:0 3px 10px rgba(0,0,0,.3);margin-bottom:14px}
.q-num{font-size:clamp(15px,1.7vw,20px);font-weight:800;letter-spacing:2px;color:#6b4a1e;margin-bottom:10px}
.q-text{font-size:clamp(26px,4vw,52px);font-weight:800;line-height:1.45;margin:6px 0 4px;text-shadow:0 1px 0 rgba(255,255,255,.25)}
.q-seal{position:absolute;top:-18px;right:clamp(18px,4vw,44px);width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#f6df95,#c9932f 70%,#8a5f16);border:3px solid #8a5f16;
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4a3008;font-family:var(--font-text);
  box-shadow:0 6px 16px rgba(0,0,0,.4);transform:rotate(-8deg)}
.q-seal b{font-size:26px;line-height:1;font-weight:900}.q-seal span{font-size:11px;font-weight:800}
.q-answer-label{font-size:clamp(18px,2.2vw,26px);color:#7a4a12;font-weight:800;margin:14px 0 6px;letter-spacing:4px}
.q-answer{font-size:clamp(34px,6vw,74px);font-weight:900;color:#7a1f0f;line-height:1.3;
  text-shadow:0 2px 0 rgba(255,255,255,.3)}
.q-note{margin:18px auto 0;max-width:90%;font-family:var(--font-text);font-size:clamp(13px,1.6vw,19px);font-weight:700;
  color:#4a3418;background:rgba(120,80,30,.14);border:1px solid rgba(120,80,30,.35);border-radius:12px;padding:12px 18px;line-height:1.7}
.q-hidden{font-size:clamp(40px,9vw,110px);font-weight:900;color:rgba(90,60,25,.45);letter-spacing:14px;margin-top:6px}
.quiz-intro-title{font-size:clamp(30px,6vw,74px);font-weight:900;line-height:1.3;
  color:#4a2c10;text-shadow:0 2px 0 rgba(255,255,255,.3)}

  {q:'虹がいろいろな色に分かれて見える主な理由は？', a:'光が水滴で屈折・反射し、色ごとに分かれるから', note:'虹といえば7色というのは世界共通ではないんだって！国によっては2色と考えている国も！そんなわけなくない？'},
  {q:'アイドル用語の「リリイベ」とは何の略？', a:'リリースイベント', note:'新曲やアルバムを発売するときにやるイベントのこと！僕はこのクイズを作っているときに知りました！'},
  {q:'グループのメンバー全員を応援している状態を何という？', a:'箱推し', note:'ちなみに書籍の表紙を豪華にしたいときは「箔押し」を使ったりするよね！BQPのみんなはウケてくれてるよね！？'},
];
const MAX_TOTAL = 300; // 1チーム最大（クイズ100 + イラスト150 + チャレンジ50）

/* ================================================================
   STATE
   ================================================================ */
const KEY='rectool.state.v4';
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('rectool') : null;
// 投影モード判定：①「📺 投影モード」ボタン（タブ単位・claude.ai版でも確実）
// ②URLに #present（ローカルindex.html向け） ③?view=present
function detectPresent(){
  try{if(sessionStorage.getItem('rectool.present')==='1')return true;}catch(e){}
  return location.hash.replace(/^#/,'')==='present' || new URLSearchParams(location.search).get('view')==='present';
}
let isPresent = detectPresent();
function applyPresent(){
  isPresent=detectPresent();
  document.body.classList.toggle('present',isPresent);
  const x=document.getElementById('presentExit'); if(x)x.style.display=isPresent?'flex':'none';
  renderAll();
}
function enterPresent(){try{sessionStorage.setItem('rectool.present','1');}catch(e){} applyPresent();}
function exitPresent(){
  try{sessionStorage.removeItem('rectool.present');}catch(e){}
  if(location.hash.replace(/^#/,'')==='present'){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
  applyPresent();
}
function baseURL(){return location.href.split('#')[0];}
function presentURL(){return baseURL()+'#present';}

function freshState(){
  return {
    teams: DEFAULT_TEAMS.map((t,i)=>({id:i+1,name:t.name,members:t.members,color:TEAM_COLORS[i],score:0})),
    log: [],
    scene: 'scoreboard',
    timer: {endsAt:null, remaining:30000, running:false, duration:30000},
    topic: {flatIndex:0, revealed:false},
    quiz: {view:'intro', index:0, revealed:false},
    roulette: {spinId:0, resultIndex:null, revealed:false},

}
// ガチャ景品（添付「当たりくじ」16品／各1個）
const PRIZES_VERSION = 2;

  return [
    'Air Jordan','テンピュール','AirTag','CASIO F-91W',
    'カップヌードル','HARIBO','Nutella','Post-it',
    'ギネス世界記録2026','ディズニーチケット','深海生物図鑑＋深煎りコーヒーギフト','リンベル 海鮮グルメギフト',
    'シロナガスクジラぬいぐるみ＋大判ブランケット','ORO BAILEN ピクアル オリーブオイル','LUPICIA 中国茶セット','スタバカード',
  ].map((name,i)=>({id:'p'+(i+1),name,qty:1}));
}
let state = load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.teams){
    if(!s.gameMaster)s.gameMaster={name:'藤沼',title:'ゲームマスター',photo:null};
    if(!s.quiz)s.quiz={view:'intro',index:0,revealed:false};

  }}catch(e){}

}

/* ================================================================
   SOUND (WebAudio, 外部ファイル不要)
   ================================================================ */
let actx=null;
function AC(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return actx; }
function tone(freq,dur,type='sine',vol=.25,delay=0){
  const c=AC(); if(!c) return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;
  const t=c.currentTime+delay;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
const SFX={
  ding(){tone(880,.18,'sine',.3);tone(1320,.25,'sine',.22,.05);},
  good(){[523,659,784].forEach((f,i)=>tone(f,.22,'triangle',.28,i*0.07));},
  buzz(){tone(160,.35,'sawtooth',.25);tone(120,.4,'sawtooth',.2,.02);},
  tick(){tone(1200,.05,'square',.12);},
  fanfare(){[523,659,784,1046].forEach((f,i)=>tone(f,.5,'triangle',.3,i*0.12));
            tone(1318,.8,'triangle',.28,.55);},
  drum(){const c=AC();if(!c)return;for(let i=0;i<20;i++)tone(90+Math.random()*40,.04,'square',.14,i*0.055);},
  win(){[659,784,988,1318,1568].forEach((f,i)=>tone(f,.4,'triangle',.32,i*0.09));},
};

/* ================================================================
   CONFETTI
   ================================================================ */
const cvs=document.getElementById('confetti'),ctx=cvs.getContext('2d');
let parts=[],raf=null;
function sizeCvs(){cvs.width=innerWidth;cvs.height=innerHeight;}
addEventListener('resize',sizeCvs);sizeCvs();
function confetti(n=140){
  const cols=['#0a84ff','#2997ff','#30d158','#ff9f0a','#ff453a','#bf5af2','#f5f5f7'];
  for(let i=0;i<n;i++)parts.push({
    x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*.3,
    vx:(Math.random()-.5)*6,vy:2+Math.random()*5,
    s:6+Math.random()*8,rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,
    col:cols[Math.floor(Math.random()*cols.length)],life:1
  });
  if(!raf)loopC();
}
function loopC(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  parts.forEach(p=>{p.vy+=.08;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vx*=.99;
    if(p.y>cvs.height+30)p.life=0;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;
    ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
  parts=parts.filter(p=>p.life>0);
  if(parts.length)raf=requestAnimationFrame(loopC);else{raf=null;ctx.clearRect(0,0,cvs.width,cvs.height);}
}

/* ================================================================
   MUTATIONS
   ================================================================ */
function nowStr(){const d=new Date();return d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function team(id){return state.teams.find(t=>t.id===id);}
function addPoints(id,delta,label){
  const t=team(id); if(!t)return;
  t.score=Math.max(0,t.score+delta);
  state.log.unshift({time:nowStr(),team:t.name,delta,label,color:t.color});
  state.log=state.log.slice(0,120);
  save();
  if(!isPresent){ delta>0?SFX.good():SFX.buzz(); }
  renderAll();
  if(delta>0 && state.scene==='scoreboard') confetti(40);
}
function undo(){
  const last=state.log[0]; if(!last)return;
  const t=state.teams.find(x=>x.name===last.team); if(t)t.score=Math.max(0,t.score-last.delta);
  state.log.shift(); save(); renderAll();
}
function setScene(s){ state.scene=s; save(); renderAll(); if(s==='result'){SFX.fanfare();confetti(220);} }

const stageBody=document.getElementById('stageBody');

let prevRanks={};
function renderScoreboard(){
  const sorted=sortedTeams();
  const max=Math.max(50,...sorted.map(t=>t.score));
  let h='<div class="board-title">🏆 現在のポイント 🏆</div><div class="board-sub">最大 '+MAX_TOTAL+'pt / チーム</div>';
  sorted.forEach((t,i)=>{
    const medal=['🥇','🥈','🥉'][i]||'';
    const pct=(t.score/max)*100;
    const changed=prevRanks[t.id]!==undefined && prevRanks[t.id]!==i;
    const dir=(prevRanks[t.id]!==undefined && i<prevRanks[t.id])?'flash-up':(prevRanks[t.id]>i?'':'');
    h+=`<div class="rankrow ${i===0?'leader':''} ${changed?dir:''}" data-tid="${t.id}">
      <div class="${medal?'medal':'rank'}">${medal||(i+1)}</div>
      <div class="tname">${t.name}<div class="tmembers">${t.members.length}名</div></div>
      <div class="barwrap"><div class="bar" style="width:${pct}%;background:linear-gradient(90deg,${t.color},${t.color}cc)"></div></div>
      <div class="score" style="color:${i===0?'var(--accent-dark)':'var(--on-dark)'}">${t.score}</div>
    </div>`;
  });
  stageBody.innerHTML=h;
  sorted.forEach((t,i)=>prevRanks[t.id]=i);
}

  const s=sortedTeams();

/* ---- Roulette stage（チャレンジ種目ルーレット） ---- */
const ROULETTE_COLORS=['#ff453a','#0a84ff','#30d158','#ff9f0a','#bf5af2'];
let lastRouletteShown=0;
function renderRouletteStage(){
  const r=state.roulette||{spinId:0,resultIndex:null,revealed:false};
  const n=CHALLENGES.length, seg=360/n;
  const grad=ROULETTE_COLORS.slice(0,n).map((c,i)=>`${c} ${i*seg}deg ${(i+1)*seg}deg`).join(',');
  const legend=CHALLENGES.map((c,i)=>`<div class="rl-item ${r.revealed&&r.resultIndex===i?'win':''}"><span class="rl-sw" style="background:${ROULETTE_COLORS[i%ROULETTE_COLORS.length]}"></span>${i+1}. ${c}</div>`).join('');
  const result=(r.revealed&&r.resultIndex!=null)
    ? `<div class="roulette-result">🎯 ${CHALLENGES[r.resultIndex]}！</div>`
    : `<div class="roulette-result" style="color:var(--muted)">${r.spinId?'　':'「ルーレットを回す」で種目を決定'}</div>`;
  stageBody.innerHTML=`<div class="roulette-stage">
    <div class="roulette-title">🎯 チャレンジ種目ルーレット</div>
    <div class="wheel-wrap"><div class="wheel-pointer"></div>
      <div class="wheel" id="wheelEl" style="background:conic-gradient(${grad})"><div class="wheel-hub"></div></div>
    </div>
    ${result}
    <div class="roulette-legend">${legend}</div>
  </div>`;
  const wheel=document.getElementById('wheelEl');if(!wheel)return;
  const restDeg=(i)=>360*6-(i*seg+seg/2); // 勝ちセグメント中心を上（ポインター）へ
  if(r.spinId>lastRouletteShown && r.resultIndex!=null){
    lastRouletteShown=r.spinId;
    wheel.style.transition='none';wheel.style.transform='rotate(0deg)';void wheel.offsetHeight;
    if(!isPresent)SFX.drum();
    wheel.style.transition='transform 4s cubic-bezier(.12,.72,.14,1)';
    wheel.style.transform=`rotate(${restDeg(r.resultIndex)}deg)`;
    setTimeout(()=>{
      if(!isPresent){SFX.win();}
      confetti(160);
      if(state.roulette&&state.roulette.spinId===r.spinId){ state.roulette.revealed=true; if(!isPresent)save(); }
      if(state.scene==='roulette')renderRouletteStage();
    },4050);
  }else if(r.resultIndex!=null){
    wheel.style.transition='none';wheel.style.transform=`rotate(${restDeg(r.resultIndex)}deg)`;
  }
}
function spinRoulette(){
  const i=Math.floor(Math.random()*CHALLENGES.length);
  state.roulette={spinId:(state.roulette?.spinId||0)+1, resultIndex:i, revealed:false};
  state.scene='roulette';save();renderAll();
}

/* ---- Timer stage (self-running from shared endsAt) ---- */
let timerRaf=null;
function timerRemaining(){
  const t=state.timer;
  if(t.running && t.endsAt) return Math.max(0,t.endsAt-Date.now());
  return t.remaining;
}
function fmt(ms){const s=Math.ceil(ms/1000);return s;}
function renderTimerStage(){
  stopTimerRaf();
  const paint=()=>{
    if(state.scene!=='timer'){stopTimerRaf();return;} // シーンが変わったら停止
    const ms=timerRemaining();
    const s=fmt(ms);
    let cls='',lbl='のこり時間';
    if(ms<=5000&&ms>0)cls='danger';else if(ms<=10000&&ms>0)cls='warn';
    let inner;
    if(ms<=0 && (state.timer.running||state.timer.endsAt)){inner=`<div class="timer-done">⏰ TIME UP!</div>`;lbl='';}
    else inner=`<div class="timer-num ${cls}">${s}</div>`;
    stageBody.innerHTML=`<div class="timer-stage"><div class="timer-label">${lbl}</div>${inner}</div>`;
    // tick sound only in present or admin when at scene
    if(state.timer.running){
      if(ms>0 && ms<=5500 && s!==lastTickSec){ lastTickSec=s; SFX.tick(); }
      if(ms<=0 && !timeUpFired){ timeUpFired=true; SFX.buzz(); confetti(60); }
      if(ms>0) timerRaf=requestAnimationFrame(paint);
    }
  };
  paint();
}
let lastTickSec=null,timeUpFired=false;
function stopTimerRaf(){ if(timerRaf){cancelAnimationFrame(timerRaf);timerRaf=null;} }

/* ---- Topic stage ---- */
function flatTopics(){const a=[];TOPICS.forEach(g=>g.items.forEach(it=>a.push({set:g.set,ans:it})));return a;}
function renderTopicStage(){
  const all=flatTopics();
  const idx=Math.min(state.topic.flatIndex,all.length-1);
  const cur=all[idx];
  let ansHtml=state.topic.revealed
    ? `<div class="topic-answer">${cur.ans}</div>`
    : `<div class="topic-hidden">？？？</div>`;
  stageBody.innerHTML=`<div class="topic-stage">
    <div class="topic-count">お題 ${idx+1} / ${all.length}</div>
    <div class="topic-set">${cur.set}</div>
    ${ansHtml}
  </div>`;
}

/* ---- Gacha stage ---- */
let lastSpinShown=0;
function renderGachaStage(){
  const g=state.gacha;
  const pool=gachaPool();
  const names=pool.length?pool.map(p=>p.name):['景品を登録してください'];
  const isNewSpin=g.spinId>lastSpinShown; // 回転中は結果テキストを伏せる
  let resultHtml=(g.result&&!isNewSpin)?`<div class="gacha-result">🎉 ${g.result} 🎉</div>`:'<div class="gacha-result"></div>';
  let winner=(g.winnerTeamId&&!isNewSpin)?`<div class="gacha-win-team">当選チーム：${team(g.winnerTeamId)?.name||''}</div>`:'';
  stageBody.innerHTML=`<div class="gacha-stage">
    <div class="gacha-title">🎁 景品ガチャ 🎁</div>
    <div class="reel"><div class="reel-track" id="reelTrack"></div></div>
    ${resultHtml}${winner}
  </div>`;
  const track=document.getElementById('reelTrack');
  // build reel items
  const reel=[];
  for(let i=0;i<24;i++)reel.push(names[Math.floor(Math.random()*names.length)]);
  const finalName=g.result||names[0];
  reel.push(finalName);
  track.innerHTML=reel.map(n=>`<div class="reel-item">${n}</div>`).join('');
  // animate only when a new spin arrived
  if(isNewSpin){
    lastSpinShown=g.spinId;
    const H=150,total=reel.length;
    track.style.transition='none';
    track.style.transform='translateY(0)';
    void track.offsetHeight;
    if(!isPresent)SFX.drum();
    track.style.transition='transform 3.4s cubic-bezier(.15,.85,.2,1)';
    track.style.transform=`translateY(-${(total-1)*H}px)`;
    const shownSpin=g.spinId;
    setTimeout(()=>{
      if(!isPresent){SFX.win();} confetti(180);
      // 回転終了後に結果テキストと当選チームを表示
      if(state.scene==='gacha'&&state.gacha.spinId===shownSpin)renderGachaStage();
    },3350);
  }else{
    // static: show final at rest
    track.style.transition='none';
    track.style.transform=`translateY(-${(reel.length-1)*150}px)`;
  }
}
function gachaPool(){return state.prizes.filter(p=>p.qty>0);}

function renderTimerPanel(){
  const t=state.timer;
  panel.innerHTML=`<h3>⏱ シンキングタイマー</h3>
  <div class="hint">クイズ30秒 / イラスト1分などのカウントダウン。開始すると投影画面が自動でタイマー表示に切替わります。</div>
  ${sceneButtons()}
  <div class="scene-btns">
    <button class="scene-btn" data-sec="30">30秒</button>
    <button class="scene-btn" data-sec="60">60秒</button>
    <button class="scene-btn" data-sec="90">90秒</button>
    <button class="scene-btn" data-sec="10">10秒</button>
  </div>
  <div class="field"><label>秒数を指定</label><input type="number" id="secIn" value="${Math.round((t.duration||30000)/1000)}"></div>
  <button class="bigbtn" id="tStart">▶ スタート（投影へ）</button>
  <button class="ghostbtn" id="tPause">⏸ 一時停止 / 再開</button>
  <button class="ghostbtn" id="tReset">⟲ リセット</button>
  <div class="mini">状態：${t.running?'⏱ 動作中':'停止中'}　残り約 ${Math.round(timerRemaining()/1000)} 秒</div>`;
  panel.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{document.getElementById('secIn').value=b.dataset.sec;startTimer(+b.dataset.sec*1000);});
  document.getElementById('tStart').onclick=()=>{const s=parseInt(document.getElementById('secIn').value,10)||30;startTimer(s*1000);};
  document.getElementById('tPause').onclick=pauseTimer;
  document.getElementById('tReset').onclick=resetTimer;
  bindSceneBtns();
}
function startTimer(ms){
  timeUpFired=false;lastTickSec=null;
  state.timer={endsAt:Date.now()+ms,remaining:ms,running:true,duration:ms};
  state.scene='timer';save();renderAll();
}
function pauseTimer(){
  const t=state.timer;
  if(t.running){t.remaining=Math.max(0,t.endsAt-Date.now());t.running=false;t.endsAt=null;}
  else{t.endsAt=Date.now()+(t.remaining||0);t.running=true;timeUpFired=false;lastTickSec=null;}
  save();renderAll();
}
function resetTimer(){timeUpFired=false;lastTickSec=null;
  state.timer={endsAt:null,remaining:state.timer.duration||30000,running:false,duration:state.timer.duration||30000};
  save();renderAll();}

      <button class="rm" data-dec="${p.id}">−</button>
      <button class="rm" style="background:rgba(49,217,122,.16);border-color:rgba(49,217,122,.35)" data-inc="${p.id}">＋</button>

    <button class="ghostbtn" style="margin:0;flex:1" id="addPrize">＋ 追加</button></div>`;
  document.getElementById('spinBtn').onclick=spinGacha;
  panel.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const p=state.prizes.find(x=>x.id===b.dataset.inc);p.qty++;save();renderPanel();});
  panel.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const p=state.prizes.find(x=>x.id===b.dataset.dec);p.qty=Math.max(0,p.qty-1);save();renderPanel();});

  document.getElementById('addPrize').onclick=()=>{
    const n=document.getElementById('newPrize').value.trim();const q=parseInt(document.getElementById('newQty').value,10)||1;

function spinGacha(){
  const pool=gachaPool();if(!pool.length)return;
  const pick=pool[Math.floor(Math.random()*pool.length)];
  pick.qty=Math.max(0,pick.qty-1);
  const wt=document.getElementById('gTeam').value;
  state.gacha={spinId:(state.gacha.spinId||0)+1,result:pick.name,winnerTeamId:wt?+wt:null,spinning:true};
  state.scene='gacha';save();renderAll();
}

/* ---- ゲームマスター写真の登録（端末内で縮小してdataURL保存） ---- */
function setHostPhoto(file){
  const reader=new FileReader();
  reader.onload=(ev)=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=440;
      const scale=Math.min(1,MAX/Math.max(img.width,img.height));
      const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      let data;try{data=c.toDataURL('image/jpeg',0.82);}catch(e){data=ev.target.result;}
      state.gameMaster=gm();state.gameMaster.photo=data;
      save();if(!isPresent){SFX.ding();confetti(60);}renderAll();
    };
    img.onerror=()=>alert('画像の読み込みに失敗しました。別の画像でお試しください。');
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
